name: 'Build and Release Docker Images'

on:
  push:
    branches: [ main, master ]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  push_to_registry:
    name: Push Docker images to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Get the version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=latest" >> $GITHUB_OUTPUT
          fi

      - name: Lowercase owner
        id: owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.OWNER }}/annotation-backend:${{ steps.get_version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.OWNER }}/annotation-backend:latest
          platforms: linux/amd64,linux/arm64  # ARM64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.OWNER }}/annotation-frontend:${{ steps.get_version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.OWNER }}/annotation-frontend:latest
          platforms: linux/amd64,linux/arm64  # ARM64
          cache-from: type=gha
          cache-to: type=gha,mode=max